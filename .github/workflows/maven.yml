name: Java CI with Maven
on: workflow_dispatch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Checkout CI Repo
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: maven

      - name: Build with Maven
        run: mvn clean install

      - name: Build the Docker image
        run: docker build -t hassaneid/frontend:v${{ github.run_number }} .

      - name: Login to dockerhub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      - name: Push the Docker image
        run: docker push hassaneid/frontend:v${{ github.run_number }}

      - name: Checkout CD Repo
        uses: actions/checkout@v4
        with: 
          repository: Hassan-Eid-Hassan/frontend-cd
          path: cdRepo
          token: ${{ secrets.CD_REPO_TOKEN }}
      
      - name: Update image tag in the deployment
        run: sed -i "s#.*image: .*#        image: hassaneid/frontend:v${{ github.run_number }}#g" cdRepo/deployment.yaml

      - name: Commit and push changes
        run: |
          cd cdRepo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Update image to v${{ github.run_number }}"
          git push